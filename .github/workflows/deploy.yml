name: Deploy to Infomaniak (FTP)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # Vide le dossier distant avant chaque envoi. Nécessaire ici pour
          # purger les fichiers de l'ancien site (style.css, script.js…), mais
          # cela implique que TOUT doit vivre dans le dépôt : un fichier présent
          # seulement sur le FTP est détruit. Le .htaccess est versionné à la
          # racine pour cette raison — ne pas l'en retirer.
          dangerous-clean-slate: true
